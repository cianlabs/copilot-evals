name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # runbook-copilot is not a pip package. Download the commit named in
      # collect_runs.py so the tests import the same code as a local practice pass.
      - name: Download the pinned runbook-copilot checkout
        run: python -c "import collect_runs; print(collect_runs.ensure_checkout())"

      # The graph version lives only on an unmerged branch. Download it into
      # .vendor-graph so one comparison test can run. The tests do not go online.
      - name: Download the graph-agent branch
        run: python -c "import compare_agents; print(compare_agents.ensure_graph_checkout())"

      - name: Run tests
        run: python -m pytest -q

      # Committed results and the practice model only. No API key, no real model.
      - name: Check recorded results against the floor
        run: python regression_check.py
